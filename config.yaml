defaultContentLanguage: "pt" # matches the theme's i18n/pt.yaml
languages:
  pt:
    languageName: "Português"
    locale: "pt-BR"
baseURL: "https://vfcardoso.dev"
title: "Vinícius Cardoso"
pagination:
  pagerSize: 10
enableRobotsTXT: true
enableEmoji: true

module:
  imports:
  - path: github.com/hugo-theme-anubis2/hugo-theme-anubis2

menu:
  main:
  - identifier: about
    name: Sobre mim
    title: Sobre mim
    url: /
    weight: 1

  - identifier: blog
    name: Blog
    title: Blog
    url: /posts/
    weight: 2

  - identifier: "contact"
    name: Contato
    title: Contato
    url: "/contact/"
    weight: 3

  # Fediring webring (rendered by the theme's footer menu)
  footer:
  - identifier: fediring-previous
    name: "←"
    title: Fediring anterior
    url: "https://fediring.net/previous?host=vfcardoso.dev"
    weight: 1

  - identifier: fediring
    name: Fediring
    title: Fediring
    url: "https://fediring.net/"
    weight: 2

  - identifier: fediring-next
    name: "→"
    title: Próximo no Fediring
    url: "https://fediring.net/next?host=vfcardoso.dev"
    weight: 3

taxonomies:
  category: "categories"
  tag: "tags"

params:
  description: "Uma pequena coleção de ideias simples."
  mainSections:
    - posts
  author:
    name: "Vinícius Cardoso"
  copyright: "Vinícius Cardoso" # the theme would print the whole author map otherwise
  email: me@vfcardoso.dev
  dateFormat: "2006-01-02"

  anubis2:
    colortheme: dark
    enablecolorthemeswitcher: false
    enablecopycodebutton: true
    enablereadmorebutton: false
    enablerssicon: true
    customcss:
      - css/overrides.css # relative path to "assets" directory
    socialicons:
    # "rel=me" is added by the theme to every social link (Mastodon verification)
    - id: github
      url: "https://github.com/vfcardoso-dev"
    - id: linkedin
      url: "https://www.linkedin.com/in/vfcardoso"
    - id: mastodon
      url: "https://bolha.us/@vfcardoso"

markup:
  goldmark:
    renderer:
      unsafe: true # enable raw HTML in Markdown
